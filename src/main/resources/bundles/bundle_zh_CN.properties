# 建造透视：Miner（minRi2）的 JavaScript 模组 build-xray 的 Java 移植版。
# 原始脚本与描述文件保存在 original/ 便于对照。

category.build-xray.name = 建造透视

setting.bx-enabled.name = 建造透视：启用
setting.bx-enabled.description = 建造、拆除或规划时，让建造预览遮挡的部分变透明。
setting.bx-transparent.name = 透视遮罩的透明度
setting.bx-transparent.description = 被淡化的区域去掉多少。0% 表示完全不变透明。
setting.bx-mouse-radius.name = 鼠标位置的透视半径
setting.bx-mouse-radius.description = 鼠标周围始终保持透明的范围（格）。
setting.bx-fade-in.name = 淡入时间
setting.bx-fade-in.description = 开始建造或规划后，透视效果完全显现所需的时间。
setting.bx-fade-out.name = 淡出时间
setting.bx-fade-out.description = 停止操作后，透视效果完全消失所需的时间；这段时间内选区遮罩会保持显示。

bx.mouse-radius.tile = {0} 格
