# 建造透视：Miner（minRi2）的 JavaScript 模组 build-xray 的 Java 移植版。
# 原始脚本与描述文件保存在 original/ 便于对照。

category.build-xray.name = 建造透视
keybind.build-xray.peek.name = 指针透视（按住）

setting.bx-enabled.name = 建造透视：启用
setting.bx-enabled.description = 建造、拆除或规划时，让建造预览遮挡的部分变透明。
setting.bx-transparent.name = 透视遮罩的透明度
setting.bx-transparent.description = 被淡化的区域去掉多少。0% 表示完全不变透明。
setting.bx-mask-soft.name = 遮罩边缘软化
setting.bx-mask-soft.description = 遮罩边缘的软化程度，越高则向不透视区域的过渡越宽。
setting.bx-mouse-radius.name = 鼠标位置的透视半径
setting.bx-mouse-radius.description = 鼠标周围始终保持透明的范围（格），v1.5 起该数值是半径而非直径。
setting.bx-rect-expand.name = 矩形渐变带拓宽范围
setting.bx-rect-expand.description = 矩形遮罩外侧额外拓宽的渐变带宽度（格）。
setting.bx-fade-in.name = 淡入时间
setting.bx-fade-in.description = 开始建造或规划后，透视效果完全显现所需的时间。
setting.bx-fade-out.name = 淡出时间
setting.bx-fade-out.description = 停止操作后，透视效果完全消失所需的时间；这段时间内选区遮罩会保持显示。
setting.bx-ground-units.name = 透视陆军和海军单位
setting.bx-ground-units.description = 陆军与海军单位也一并变透明。
setting.bx-plans.name = 规划时透视
setting.bx-plans.description = 透视蓝图规划覆盖的区域。
setting.bx-logic.name = 逻辑配置时透视
setting.bx-logic.description = 透视正在配置的逻辑块周围的范围。

setting.tile = {0} 格
