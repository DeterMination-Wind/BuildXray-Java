# Build X-ray - Java port of the JavaScript mod "build-xray" by minRi2 (Miner).
# The original scripts/descriptor are kept under original/ for provenance.

category.build-xray.name = Build X-Ray
keybind.build-xray.peek.name = Cursor X-Ray (Hold)

setting.bx-enabled.name = Build X-Ray: Enable
setting.bx-enabled.description = Fade out what the build preview covers while building, breaking or planning.
setting.bx-transparent.name = Mask transparency
setting.bx-transparent.description = How much of the faded area is removed. 0% keeps it fully visible.
setting.bx-mask-soft.name = Mask edge softness
setting.bx-mask-soft.description = How soft the mask edge is. Higher values widen the transition into the area that is not x-rayed.
setting.bx-mouse-radius.name = Cursor mask radius
setting.bx-mouse-radius.description = Radius around the cursor that always stays transparent, in tiles.
setting.bx-rect-expand.name = Rect gradient band width
setting.bx-rect-expand.description = Extra width of the gradient band around rectangular areas, in tiles.
setting.bx-fade-in.name = Fade in time
setting.bx-fade-in.description = How long the x-ray takes to fade in after you start building or planning.
setting.bx-fade-out.name = Fade out time
setting.bx-fade-out.description = How long the x-ray takes to fade out after you stop. The selection mask stays visible for this long.
setting.bx-ground-units.name = X-Ray ground & naval units
setting.bx-ground-units.description = Also make ground and naval units transparent.
setting.bx-plans.name = X-Ray while planning
setting.bx-plans.description = Make the area covered by build plans transparent.
setting.bx-logic.name = X-Ray while configuring logic
setting.bx-logic.description = Make the area around the logic block whose config is open transparent.

setting.tile = {0} Tiles
