# Build X-ray - Java port of the JavaScript mod "build-xray" by minRi2 (Miner).
# The original script/descriptor are kept under original/ for provenance.

category.build-xray.name = Build X-Ray

setting.bx-enabled.name = Build X-Ray: Enable
setting.bx-enabled.description = Fade out what the build preview covers while building, breaking or planning.
setting.bx-transparent.name = Mask transparency
setting.bx-transparent.description = How much of the faded area is removed. 0% keeps it fully visible.
setting.bx-mouse-radius.name = Cursor mask radius
setting.bx-mouse-radius.description = Radius around the cursor that always stays transparent, in tiles.
setting.bx-fade-in.name = Fade in time
setting.bx-fade-in.description = How long the x-ray takes to fade in after you start building or planning.
setting.bx-fade-out.name = Fade out time
setting.bx-fade-out.description = How long the x-ray takes to fade out after you stop. The selection mask stays visible for this long.

bx.mouse-radius.tile = {0} Tiles
